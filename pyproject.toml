[project]
name = "documind"
version = "0.1.0"
description = "Search and retrieve technical documentation locally"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi[standard]>=0.136.1",
    "instructor>=1.15.1",
    "pydantic>=2.13.4",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.47.0",
    "sentence-transformers>=5.4.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documind"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
